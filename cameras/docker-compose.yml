services:
  mcp-servers-camera:
    build: .
    image: ${REPOSITORY_URL}/${REPOSITORY_ID}/mcp-servers/cameras:${BUILD_VERSION}
    container_name: mcp-servers-camera
    hostname: mcp-servers-camera
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./etc/config.ini:/home/server/etc/config.ini
